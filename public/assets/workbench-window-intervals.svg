  <path d="M458.667 170L458.667 502" class="zero"/>
  <text x="458.667" y="535" class="tick" text-anchor="middle">0</text>
  <path d="M599.333 170L599.333 502" class="grid"/>
  <text x="599.333" y="535" class="tick" text-anchor="middle">+50</text>
