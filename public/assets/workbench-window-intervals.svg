  <path d="M346.973 189L704.05 189" class="range"/>
  <circle cx="525.511" cy="189" r="6" class="estimate"/>
  <text x="910" y="197" class="value" text-anchor="end">$23.76</text>
  <text x="48" y="266" class="label" text-anchor="start">30 sessions</text>
  <text x="48" y="291" class="note" text-anchor="start">Inconclusive</text>
  <path d="M440.277 261L715.65 261" class="range"/>
  <circle cx="577.963" cy="261" r="6" class="estimate"/>
  <text x="910" y="269" class="value" text-anchor="end">$42.40</text>
  <text x="48" y="338" class="label" text-anchor="start">45 sessions</text>
  <text x="48" y="363" class="on-track" text-anchor="start">On track</text>
  <path d="M481.721 333L690.676 333" class="range-on-track"/>
  <circle cx="586.362" cy="333" r="6" class="estimate-on-track"/>
