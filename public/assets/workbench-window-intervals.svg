<svg xmlns="http://www.w3.org/2000/svg" width="960" height="608" viewBox="0 0 960 608">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #282534; }
    .title { font-family: Georgia, serif; font-size: 49px; letter-spacing: -1.4px; }
    .subtitle { fill: #594f65; font-size: 24px; }
    .label { font-size: 27px; }
    .value { font-size: 28px; font-weight: 650; }
    .tick, .note { fill: #594f65; font-size: 21px; }
    .grid { stroke: #d5cbbf; stroke-width: 1.25; }
    .zero { stroke: #827487; stroke-width: 1.5; }
    .estimate { fill: #645680; }
    .range { stroke: #746785; stroke-width: 3; stroke-linecap: round; }
    .on-track { fill: #29675c; font-size: 21px; }
    .estimate-on-track { fill: #29675c; }
    .range-on-track { stroke: #29675c; stroke-width: 3; stroke-linecap: round; }
  </style>
  <rect width="960" height="100%" fill="#f5efe6"/>
  <path d="M48 139H912" class="grid"/>
  <text x="48" y="71" class="title" text-anchor="start">How the estimate holds up</text>
  <text x="50" y="111" class="subtitle" text-anchor="start">Expected dollars per trade and its bootstrap interval</text>
  <path d="M318 170L318 502" class="grid"/>
